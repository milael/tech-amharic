{% extends "base.html" %}
{% block title %}Sign in · Tech-Amharic{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">Paste the contributor token an admin gave you. It is stored in a secure, HTTP-only cookie on this device.</p>
{% if error %}<p class="flash error" role="alert">That token was not recognised.</p>{% endif %}
<form method="post" action="/login" class="stack narrow">
  <label>Token <input name="token" type="password" required autocomplete="off" spellcheck="false" placeholder="tam_…"></label>
  <button>Sign in</button>
</form>
{% endblock %}
