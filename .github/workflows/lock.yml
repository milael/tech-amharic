name: Update uv.lock

# Run from the Actions tab (or `gh workflow run lock.yml`) to regenerate the
# lockfile and commit it when it changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv lock
      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet --exit-code -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Update uv.lock"
          git push
