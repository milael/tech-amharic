name: Import AI suggestions

# Weekly: add AI term suggestions stored by the chat Worker to the glossary
# data as *proposed* terms, on a branch with a pull request for review.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests" (enabled 2026-10-28).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/suggestions.yml, src/tech_amharic/suggestions.py]

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pull suggestions
        run: uv run tam admin pull-suggestions --data data/concepts | tee pull.log
      - run: uv run tam validate data/concepts
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/concepts; then
            echo "::notice title=AI suggestions::Nothing new to import."
            exit 0
          fi
          branch="ai-suggestions/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/concepts
          git commit -m "Import AI term suggestions as proposed terms"
          git push -f origin "$branch"
          body=$(printf 'AI suggestions made by Gemma 4 when glossary searches found nothing. Every Amharic term is **proposed** and labelled as an AI draft; review them like any other proposal.\n\n```\n%s\n```' "$(cat pull.log)")
          if ! gh pr create --head "$branch" --title "AI term suggestions $(date -u +%Y-%m-%d)" --body "$body"; then
            echo "::warning title=AI suggestions::Pushed $branch but could not open a pull request. Allow it under Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open one from the branch."
          fi
