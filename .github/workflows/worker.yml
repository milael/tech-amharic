name: Chat worker

# Tests and bundles the Cloudflare Worker on every change; deploys it when the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set.
on:
  push:
    branches: [main]
    paths: [worker/**, src/tech_amharic/chat_prompt.txt, src/tech_amharic/suggest_prompt.txt, tests/fixtures/**, .github/workflows/worker.yml]
  pull_request:
    paths: [worker/**, src/tech_amharic/chat_prompt.txt, src/tech_amharic/suggest_prompt.txt, tests/fixtures/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (incl. retrieval parity with Python)
        run: npm test
      - name: Bundle check
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist
      - name: Provision KV namespace for AI suggestions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          find_id() {
            npx --yes wrangler@4 kv namespace list 2>/dev/null | python3 -c '
          import json, sys
          text = sys.stdin.read()
          data = json.loads(text[text.index("["): text.rindex("]") + 1])
          print(next((n["id"] for n in data if n["title"].endswith("tech-amharic-suggestions")), ""))'
          }
          id=$(find_id || true)
          if [ -z "$id" ]; then
            npx --yes wrangler@4 kv namespace create tech-amharic-suggestions
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error title=KV::could not find or create the namespace"; exit 1; }
          sed -i "s/KV_NAMESPACE_ID_PLACEHOLDER/$id/" wrangler.toml
          echo "::notice title=KV namespace::tech-amharic-suggestions ready"
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          if [ -n "$url" ]; then
            echo "::notice title=Chat worker URL::${url}"
          else
            echo "::warning title=Chat worker URL::No workers.dev URL in the deploy output. Register a workers.dev subdomain in the Cloudflare dashboard (Workers & Pages)."
          fi
          # Surface wrangler's key lines (no secrets are printed by wrangler).
          grep -iE 'deployed|uploaded|subdomain|workers\.dev|warn|error|route' deploy.log | head -n 15 | while IFS= read -r line; do
            echo "::notice title=wrangler::${line}"
          done
      - name: Not deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice title=Chat worker::Skipped deploy; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable it."
      - name: Smoke test the live chat
        if: steps.deploy.outcome == 'success'
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          esc() { python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")'; }
          # A newly registered workers.dev subdomain needs a few minutes for its
          # TLS certificate; wait for /health before asking questions.
          for i in $(seq 1 30); do
            code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' "$url/health" || true)
            [ "$code" = "200" ] && break
            echo "waiting for $url ($i, got '$code')"; sleep 10
          done
          [ "$code" = "200" ] || { echo "::error title=Chat health::$url/health never returned 200"; exit 1; }
          fail=0
          for q in "ምስጠራ እንዴት ይሰራል?" "What is the difference between a virus and ransomware?" "What is the weather today?"; do
            body=$(jq -n --arg q "$q" '{question: $q}')
            out=$(curl -sS -m 90 -w '\n%{http_code}' -X POST "$url/chat" \
              -H "Origin: https://milael.github.io" -H "Content-Type: application/json" -d "$body" || printf '\n000')
            code=$(echo "$out" | tail -n 1); json=$(echo "$out" | sed '$d')
            if [ "$code" = "200" ]; then
              summary=$(echo "$json" | jq -r --arg q "$q" '"Q: \($q)\nA: \(.answer)\n\nSources: \([.concepts[] | .en + " = " + (.am // "-")] | join(", "))\nTerms used: \(.checks.terms_used | join(", "))\nGeez share: \(.checks.ethiopic_ratio)"')
              echo "::notice title=Chat answer (HTTP 200)::$(printf '%s' "$summary" | esc)"
            else
              echo "::error title=Chat failed (HTTP $code)::$(printf 'Q: %s\n%s' "$q" "$json" | esc)"
              fail=1
            fi
          done
          # AI suggestion round trip (generated or cached).
          sug=$(curl -sS -m 120 -X POST "$url/suggest" -H "Origin: https://milael.github.io" -H "Content-Type: application/json" -d '{"term":"kubernetes"}' || true)
          status=$(echo "$sug" | jq -r '.status // .error // "no-response"')
          if [ "$status" = "generated" ] || [ "$status" = "cached" ]; then
            echo "::notice title=Suggestion ($status)::$(echo "$sug" | jq -c '{term: .suggestion.term, domain: .suggestion.domain, terms: .suggestion.terms, definition_am: .suggestion.definition_am}' | esc)"
          else
            echo "::error title=Suggestion failed::$(printf '%s' "$sug" | esc)"; fail=1
          fi
          # Visitor proposals: check validation and listing without storing anything.
          pcode=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url/propose" -H "Origin: https://milael.github.io" -H "Content-Type: application/json" -d '{"concept_id":"encryption","text":"latin text"}' || true)
          [ "$pcode" = "400" ] || { echo "::error title=Propose check::expected 400 for a Latin-script term, got $pcode"; fail=1; }
          plist=$(curl -sS -m 30 "$url/proposals?concept=load-balancer" | jq -c '.proposals' || echo null)
          [ "$plist" != "null" ] && echo "::notice title=Visitor proposals (load-balancer)::$plist" || { echo "::error title=Proposals list failed::$plist"; fail=1; }
          # Wrong origins must be refused.
          bad=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url/chat" -H "Origin: https://evil.example" -H "Content-Type: application/json" -d '{"question":"hi"}' || true)
          [ "$bad" = "403" ] || { echo "::error title=Origin check::expected 403, got $bad"; fail=1; }
          exit $fail
