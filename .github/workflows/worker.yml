name: Chat worker

# Tests and bundles the Cloudflare Worker on every change; deploys it when the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set.
on:
  push:
    branches: [main]
    paths: [worker/**, src/tech_amharic/chat_prompt.txt, tests/fixtures/**, .github/workflows/worker.yml]
  pull_request:
    paths: [worker/**, src/tech_amharic/chat_prompt.txt, tests/fixtures/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (incl. retrieval parity with Python)
        run: npm test
      - name: Bundle check
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        id: deploy
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "::notice title=Chat worker URL::${url}"
      - name: Not deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice title=Chat worker::Skipped deploy; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable it."
