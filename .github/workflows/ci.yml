name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # TODO: switch back to --locked once uv.lock is committed.
      - run: uv sync --all-extras
      - name: Print resolved lockfile (to commit it)
        run: cat uv.lock
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Validate termbase data
        run: uv run tam validate data/concepts
      - name: Tests (SQLite)
        run: uv run pytest -ra

  postgres:
    # Runs the real migrations against PostgreSQL and loads the seed data.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tam
          POSTGRES_PASSWORD: tam
          POSTGRES_DB: tam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tam" --health-interval 5s --health-retries 10
    env:
      TAM_DATABASE_URL: postgresql+psycopg://tam:tam@localhost:5432/tam
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
      - run: uv run tam admin import data/concepts
      - run: uv run tam admin build --out dist/release --version ci
      - name: Data export is stable (re-export matches git)
        run: git diff --exit-code data/concepts
